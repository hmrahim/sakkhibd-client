<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>সাক্ষীবিডি (SakkhiBD) | বাংলাদেশ পাবলিক দুর্নীতি ও অন্যায় লেজার</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Initial Loading Screen (Pre-hydration to eliminate white screen flash) -->
      <div style="position:fixed;inset:0;background:#040e09;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Noto Sans Bengali',sans-serif;color:#ffffff;user-select:none;padding:16px;">
        <style>
          @keyframes spin-cw { 100% { transform: rotate(360deg); } }
          @keyframes spin-ccw { 100% { transform: rotate(-360deg); } }
          @keyframes bar-pulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
          .loader-emblem { width: 120px; height: 120px; position: relative; margin-bottom: 28px; display: flex; align-items: center; justify-content: center; }
          .loader-badge { width: 78px; height: 78px; border-radius: 24px; background: linear-gradient(135deg, #006A4E, #10b981); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 38px; color: #FFD700; box-shadow: 0 0 45px rgba(0, 106, 78, 0.7); }
          .loader-title { font-size: 18px; color: #f1f5f9; font-weight: 700; margin-bottom: 16px; text-align: center; }
          .loader-bar-wrap { width: 280px; max-width: 80vw; height: 8px; background: #092115; border-radius: 9999px; overflow: hidden; border: 1px solid rgba(16, 185, 129, 0.3); }
          .loader-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #006A4E, #FFD700, #F42A41); border-radius: 9999px; animation: bar-pulse 1.8s ease-in-out infinite; }
          @media (max-width: 640px) {
            .loader-emblem { width: 110px; height: 110px; margin-bottom: 24px; }
            .loader-badge { width: 70px; height: 70px; font-size: 34px; border-radius: 20px; }
            .loader-title { font-size: 16px; }
            .loader-bar-wrap { width: 220px; }
          }
        </style>
        <div class="loader-emblem">
          <div style="position:absolute;inset:0;border-radius:50%;border:2.5px dashed rgba(16,185,129,0.35);animation:spin-cw 8s linear infinite;"></div>
          <div style="position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;border-top-color:#F42A41;border-bottom-color:#FFD700;animation:spin-ccw 3.5s linear infinite;"></div>
          <div class="loader-badge">
            সা
          </div>
        </div>
        <div style="display:inline-flex;align-items:center;padding:5px 16px;border-radius:9999px;background:rgba(0,106,78,0.3);border:1px solid rgba(16,185,129,0.4);color:#10b981;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;">
          সাক্ষীবিডি · SakkhiBD
        </div>
        <div class="loader-title">
          তথ্য যাচাই ও সিস্টেম লোড হচ্ছে...
        </div>
        <div class="loader-bar-wrap">
          <div class="loader-bar"></div>
        </div>
        <div style="font-size:12px;color:#94a3b8;margin-top:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.5px;">
          সুরক্ষিত ও এনক্রিপ্টেড সংযোগ
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
